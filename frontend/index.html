<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silent Bottleneck Detector | IBM watsonx Hackathon 2026</title>
    <meta name="description" content="AI-powered tool to detect hidden workflow bottlenecks" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* 
           🕵️‍♂️ MODE: CARD MATCH (SLATE BLUE)
           Target: rgba(30, 38, 50) aka #1e2632
           
           invert(0.88) -> Dark Grey (~#1f1f1f)
           sepia(0.2) -> Adds slight warmth (required for hue rotation to work)
           hue-rotate(190deg) -> Shifts warmth to Blue/Slate
           saturate(1.5) -> Boosts the slate tone
           brightness(0.95) -> Fine tune luminance
        */
        langflow-chat {
            filter: invert(0.88) sepia(0.2) hue-rotate(190deg) saturate(1.5) brightness(0.95);

            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Langflow Agent Widget -->
    <script
        src="https://cdn.jsdelivr.net/gh/logspace-ai/langflow-embedded-chat@v1.0.7/dist/build/static/js/bundle.min.js"></script>

    <div style="position: fixed; top: 20px; left: 20px; z-index: 999999;">
        <langflow-chat width="50px" height="50px" window_title="Bottleneck Detector Agent"
            flow_id="cb2d21b9-e717-4923-916f-5ed784186678" host_url="http://127.0.0.1:7860">
        </langflow-chat>
    </div>
</body>

</html>
